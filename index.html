<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex Lover - Cartoon Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Padauk:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Fredoka', 'Padauk', sans-serif; 
            -webkit-tap-highlight-color: transparent; 
        }
        
        body { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            background-color: #fff3b0;
            background-image: radial-gradient(#ff9ebb 2.5px, transparent 2.5px), radial-gradient(#a0c4ff 2.5px, #fff9ec 2.5px);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
            overflow: hidden; 
            position: relative; 
        }

        .bg-heart { 
            position: absolute; 
            font-size: 24px; 
            animation: floatUp 6s linear infinite; 
            bottom: -30px; 
            z-index: 0; 
            pointer-events: none; 
            filter: drop-shadow(2px 2px 0px #2d3436);
        }
        @keyframes floatUp { 
            0% { transform: translateY(0) rotate(-10deg) scale(0.8); opacity: 1; } 
            50% { transform: translateY(-50vh) rotate(15deg) scale(1.1); }
            100% { transform: translateY(-105vh) rotate(-15deg) scale(0.9); opacity: 0; } 
        }
        
        .card-container { 
            position: relative; 
            width: 90%; 
            max-width: 400px; 
            background: #ffffff; 
            border: 4px solid #2d3436;
            border-radius: 28px; 
            box-shadow: 8px 8px 0px #2d3436; 
            padding: 28px 24px; 
            text-align: center; 
            z-index: 10; 
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0.8) rotate(-2deg); opacity: 0; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        .card-container::before {
            content: '★ LOVE QUEST ★';
            position: absolute;
            top: -16px;
            left: 50%;
            transform: translateX(-50%) rotate(-2deg);
            background: #ffde59;
            color: #2d3436;
            font-size: 12px;
            font-weight: 700;
            padding: 4px 14px;
            border: 3px solid #2d3436;
            border-radius: 20px;
            box-shadow: 3px 3px 0px #2d3436;
            letter-spacing: 1px;
        }

        h2 {
            color: #2d3436;
            font-size: 22px;
            line-height: 1.4;
            margin-top: 8px;
        }

        .gif-container { 
            width: 160px; 
            height: 160px; 
            margin: 18px auto; 
            border: 3px solid #2d3436;
            border-radius: 20px;
            background: #ffeef8;
            box-shadow: 5px 5px 0px #ff9ebb;
            padding: 6px;
            overflow: hidden;
        }
        .gif-container img { 
            width: 100%; 
            height: 100%; 
            border-radius: 14px; 
            object-fit: cover; 
        }

        .btn-group { 
            position: relative; 
            min-height: 85px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 16px; 
            flex-wrap: wrap; 
        }
        button { 
            padding: 12px 26px; 
            font-weight: 700; 
            border: 3px solid #2d3436; 
            border-radius: 18px; 
            cursor: pointer; 
            transition: transform 0.1s ease, box-shadow 0.1s ease; 
            font-size: 16px; 
            box-shadow: 0px 5px 0px #2d3436;
        }
        button:active {
            transform: translateY(4px) !important;
            box-shadow: 0px 1px 0px #2d3436 !important;
        }
        
        .primary-btn { 
            background: #4ecdc4; 
            color: #2d3436; 
        }
        .primary-btn:hover {
            background: #45b7af;
        }

        .secondary-btn { 
            background: #ff6b6b; 
            color: #ffffff; 
            text-shadow: 1px 1px 0px #2d3436;
        }
        .secondary-btn:hover {
            background: #ee5253;
        }

        .fullscreen-active { 
            position: fixed !important; 
            top: 0; left: 0; 
            width: 100vw; height: 100vh; 
            z-index: 9999; 
            border-radius: 0; 
            font-size: 32px; 
            border: none;
            box-shadow: none;
        }
        
        #captureArea {
            background: #fff9ec;
            border: 3px dashed #2d3436;
            border-radius: 20px;
            padding: 16px;
            text-align: center;
            box-shadow: inset 0 0 0 4px #ffde59;
        }
        #captureArea h3 {
            color: #ff4757;
            margin-bottom: 12px;
            font-size: 20px;
            text-shadow: 1.5px 1.5px 0px #2d3436;
            background: #ffde59;
            display: inline-block;
            padding: 4px 14px;
            border: 2.5px solid #2d3436;
            border-radius: 14px;
        }
        .result-item {
            background: #ffffff;
            border: 2.5px solid #2d3436;
            border-radius: 14px;
            padding: 10px 12px;
            margin: 10px 0;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            text-align: left;
            box-shadow: 3px 3px 0px #a0c4ff;
            gap: 5px;
        }
        .result-row {
            display: flex;
            justify-content: space-between;
            width: 100%;
            align-items: center;
        }
        .result-q {
            font-size: 13px;
            color: #2d3436;
            flex: 1;
            padding-right: 8px;
            font-weight: 700;
        }
        .result-a {
            background: #4ecdc4;
            color: #2d3436;
            border: 2px solid #2d3436;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
        }
        .result-no-count {
            font-size: 11px;
            color: #ff4757;
            font-weight: 700;
            background: #ffeef2;
            padding: 2px 8px;
            border-radius: 8px;
            border: 1.5px solid #ff4757;
        }
        
        #sendingStatus, #confirmStatus { 
            display: none; 
            font-size: 14px; 
            color: #13b11e; 
            margin-top: 12px; 
            font-weight: 700; 
        }
        
        .heart-start-btn { 
            cursor: pointer; 
            animation: pulseBeat 1.2s infinite; 
            margin: 15px auto 5px; 
            display: inline-block; 
            user-select: none; 
            background: #ffeef8;
            border: 3px solid #2d3436;
            border-radius: 50%;
            padding: 12px;
            box-shadow: 5px 5px 0px #2d3436;
        }
        .heart-start-btn img { 
            width: 120px; 
            height: auto; 
            display: block; 
        }
        @keyframes pulseBeat { 
            0% { transform: scale(1) rotate(-3deg); } 
            50% { transform: scale(1.08) rotate(3deg); } 
            100% { transform: scale(1) rotate(-3deg); } 
        }

        .burst-emoji {
            position: fixed;
            font-size: 28px;
            pointer-events: none;
            z-index: 99999;
            animation: burstAnim 0.8s ease-out forwards;
        }
        @keyframes burstAnim {
            0% { transform: translate(0, 0) scale(0.4); opacity: 1; }
            100% { transform: translate(var(--dx), var(--dy)) scale(1.4); opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="heartsContainer"></div>

    <div class="card-container" id="introScreen">
        <h2 style="color: #ff4757; margin-bottom: 8px; text-shadow: 1px 1px 0px #2d3436;">Hello ရည်းစားဟောင်းလေး</h2>
        <p style="color: #2d3436; font-size: 15px; font-weight: 700; margin-bottom: 5px;">👇 အသည်းလေးကို နှိပ်လိုက်ပါ 👇</p>
        <div class="heart-start-btn" id="startHeartBtn">
            <img src="https://i.ibb.co/Jw2MSZ6n/656577777.png" alt="Heart GIF">
        </div>
    </div>

    <div class="card-container" id="mainCard" style="display: none;">
        <h2 id="questionText">ပြန်ချစ်ကြည့်ကြမလား?</h2>
        <div class="gif-container"><img id="statusGif" src="https://i.pinimg.com/736x/c6/4e/ba/c64eba0988a517f21a67ff7506761680.jpg"></div>
        <div class="btn-group" id="btnGroup">
            <button id="yesBtn" class="primary-btn" onclick="handleInteraction(true)">ချစ်တယ်</button>
            <button id="noBtn" class="secondary-btn" onclick="handleInteraction(false)">မချစ်ဘူး</button>
        </div>
        <div id="sendingStatus" style="color: #6c5ce7;">အဖြေများကို ပို့ပေးနေပါသည်... 💌</div>
    </div>

    <div class="card-container" id="successScreen" style="display: none;">
        <div id="captureArea">
            <h3>💖 Our Love Agreement</h3>
            <div id="summaryList"></div>
        </div>
        <button id="confirmAcceptBtn" class="primary-btn" style="width:100%; margin-top:20px; background: #ffde59;" onclick="confirmAccept()">အတည်လက်ခံပါတယ် 💖</button>
        <div id="confirmStatus">အတည်ပြုချက် ပို့ပြီးပါပြီ! 🥰💌</div>
    </div>

    <script>
        const FORMSPREE_URL = "https://formspree.io/f/mppdoryv"; 

        const steps = [
            { question: "ပြန်ချစ်ကြည့်ကြမလား?", yes: "ချစ်တယ်", no: "မချစ်ဘူး", gif: "https://i.pinimg.com/736x/c6/4e/ba/c64eba0988a517f21a67ff7506761680.jpg", type: "shrink" },
            { question: "သတိရနေခဲ့တာ သိရဲ့လား", yes: "ဒီကရောပဲ", no: "မယုံပါဘူး", gif: "https://i.pinimg.com/736x/d4/2f/61/d42f61b94cc1f803eb5d738d3c41f8d9.jpg", type: "run" },
            { question: "ပြန်တွဲကြမယ်လေနော် နော်..", yes: "တွဲကြမယ်", no: "တော်ပါပြီ", gif: "https://i.pinimg.com/736x/43/59/3b/43593b38a1dc07ceed87028bfdbb684d.jpg", type: "fade" },
            { question: "ပြန်လာမယ်မလား", yes: "ပြန်လာမယ်", no: "မလာပါဘူး", gif: "https://i.pinimg.com/736x/e6/86/a8/e686a89a8aa81b3088295bbaa7321067.jpg", type: "fullscreen" },
            { question: "ဒါဆို ရည်းစားပြန်ဖြစ်ပြီနော်..ဟဲဟဲ", yes: "Yes, Of Course", no: "No..No..No", gif: "https://i.pinimg.com/736x/88/82/f7/8882f7e8fdb1ffe8e3c1f7c6d905b678.jpg", type: "magnet" }
        ];

        let currentStep = 0, yesScale = 1, noScale = 1, userAnswers = [];
        let noClickCounts = [0, 0, 0, 0, 0];

        document.getElementById('startHeartBtn').onclick = function(e) {
            const rect = this.getBoundingClientRect();
            const x = rect.left + rect.width / 2;
            const y = rect.top + rect.height / 2;
            
            const emojis = ['❤️', '💖', '⭐', '✨', '💥', '💗', '💫'];
            
            for (let i = 0; i < 22; i++) {
                let emojiEl = document.createElement('div');
                emojiEl.className = 'burst-emoji';
                emojiEl.innerText = emojis[Math.floor(Math.random() * emojis.length)];
                
                let angle = Math.random() * Math.PI * 2;
                let distance = 70 + Math.random() * 110;
                let destX = Math.cos(angle) * distance;
                let destY = Math.sin(angle) * distance;
                
                emojiEl.style.left = `${x}px`;
                emojiEl.style.top = `${y}px`;
                emojiEl.style.setProperty('--dx', `${destX}px`);
                emojiEl.style.setProperty('--dy', `${destY}px`);
                
                document.body.appendChild(emojiEl);
                
                setTimeout(() => emojiEl.remove(), 800);
            }

            setTimeout(() => {
                document.getElementById('introScreen').style.display = 'none';
                document.getElementById('mainCard').style.display = 'block';
            }, 350);
        };

        function handleInteraction(isYes) {
            nextStep(isYes);
        }

        function nextStep(isYes) {
            const yesBtn = document.getElementById('yesBtn');
            yesBtn.classList.remove('fullscreen-active');
            
            userAnswers.push({ 
                q: steps[currentStep].question, 
                a: isYes ? steps[currentStep].yes : steps[currentStep].no,
                noCount: noClickCounts[currentStep] 
            });
            
            currentStep++;
            if (currentStep < steps.length) {
                updateCard();
            } else {
                sendAnswersToFormspree();
            }
        }

        function handleNoClick() {
            noClickCounts[currentStep]++; 
            
            const step = steps[currentStep];
            const yesBtn = document.getElementById('yesBtn');
            const noBtn = document.getElementById('noBtn');

            if (step.type === "shrink") { 
                yesScale += 0.3; yesBtn.style.transform = `scale(${yesScale})`; 
                noScale -= 0.2; noBtn.style.transform = `scale(${noScale})`; 
            }
            else if (step.type === "fade") noBtn.style.opacity = '0';
            else if (step.type === "fullscreen") yesBtn.classList.add('fullscreen-active');
            else if (step.type === "magnet") { 
                noBtn.style.opacity = '0';
                yesBtn.style.transform = 'scale(1.5)';
                setTimeout(() => nextStep(true), 300);
            }
        }

        function dodgeButton(e) {
            if (e) e.preventDefault();
            noClickCounts[currentStep]++; 
            
            const noBtn = document.getElementById('noBtn');
            noBtn.style.position = 'fixed';
            noBtn.style.zIndex = '1000';

            const padding = 20;
            const maxX = window.innerWidth - noBtn.offsetWidth - padding;
            const maxY = window.innerHeight - noBtn.offsetHeight - padding;

            const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
            const randomY = Math.max(padding, Math.floor(Math.random() * maxY));

            noBtn.style.left = `${randomX}px`;
            noBtn.style.top = `${randomY}px`;
        }

        document.getElementById('noBtn').onclick = (e) => {
            if (steps[currentStep].type === "run") {
                dodgeButton(e);
            } else {
                handleNoClick();
            }
        };

        function updateCard() {
            const s = steps[currentStep];
            const noBtn = document.getElementById('noBtn');
            const mainCard = document.getElementById('mainCard');

            mainCard.style.animation = 'none';
            mainCard.offsetHeight;
            mainCard.style.animation = 'popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275)';

            document.getElementById('questionText').innerText = s.question;
            document.getElementById('yesBtn').innerText = s.yes; 
            noBtn.innerText = s.no;
            document.getElementById('statusGif').src = s.gif;
            
            document.getElementById('yesBtn').style.transform = "scale(1)"; 
            noScale = 1; 
            noBtn.style.transform = "scale(1)"; 
            noBtn.style.opacity = "1"; 
            noBtn.style.position = 'static';
            noBtn.style.left = 'auto';
            noBtn.style.top = 'auto';
            
            noBtn.onmouseover = null;
            noBtn.ontouchstart = null;

            if (s.type === "run") {
                noBtn.onmouseover = dodgeButton;
                noBtn.ontouchstart = dodgeButton;
            }
        }

        function sendAnswersToFormspree() {
            document.getElementById('btnGroup').style.display = 'none';
            document.getElementById('sendingStatus').style.display = 'block';

            let formData = {};
            userAnswers.forEach((item, index) => {
                formData[`မေးခွန်း ${index + 1}: ${item.q}`] = `${item.a} (ငြင်းခဲ့သည့်အကြိမ်ရေ: ${item.noCount} ကြိမ်)`;
            });

            if (!FORMSPREE_URL) {
                showResult();
                return;
            }

            fetch(FORMSPREE_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Accept": "application/json"
                },
                body: JSON.stringify(formData)
            })
            .then(() => showResult())
            .catch(() => showResult());
        }

        function showResult() {
            document.getElementById('mainCard').style.display = 'none';
            document.getElementById('successScreen').style.display = 'block';
            document.getElementById('summaryList').innerHTML = userAnswers.map((item, i) => 
                `<div class="result-item">
                    <div class="result-row">
                        <span class="result-q">${i+1}. ${item.q}</span>
                        <span class="result-a">${item.a}</span>
                    </div>
                    <div class="result-no-count">❌ ငြင်းခဲ့သည့်အကြိမ်ရေ: ${item.noCount} ကြိမ်</div>
                </div>`
            ).join('');
        }

        function confirmAccept() {
            const btn = document.getElementById('confirmAcceptBtn');
            const statusText = document.getElementById('confirmStatus');
            
            btn.disabled = true;
            btn.innerText = "ပို့နေပါသည်... 💌";

            const confirmData = {
                "အကြောင်းအရာ": "💖 အတည်လက်ခံပါတယ် ခလုတ်ကို နှိပ်လိုက်ပါပြီ!",
                "အခြေအနေ": "Our Love Agreement ကို အတည်ပြုပြီးပါပြီ။",
                "နှိပ်လိုက်သည့်အချိန်": new Date().toLocaleString()
            };

            if (!FORMSPREE_URL) {
                btn.innerText = "အတည်လက်ခံပြီးပါပြီ ✅";
                statusText.style.display = 'block';
                return;
            }

            fetch(FORMSPREE_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Accept": "application/json"
                },
                body: JSON.stringify(confirmData)
            })
            .then(() => {
                btn.innerText = "အတည်လက်ခံပြီးပါပြီ ✅";
                statusText.style.display = 'block';
            })
            .catch(() => {
                btn.innerText = "အတည်လက်ခံပြီးပါပြီ ✅";
                statusText.style.display = 'block';
            });
        }

        const bgIcons = ['💖', '⭐', '☁️', '🌸', '✨'];
        setInterval(() => {
            let h = document.createElement('div');
            h.className = 'bg-heart';
            h.innerHTML = bgIcons[Math.floor(Math.random() * bgIcons.length)];
            h.style.left = Math.random() * 100 + 'vw';
            document.getElementById('heartsContainer').appendChild(h);
            setTimeout(() => h.remove(), 6000);
        }, 700);
    </script>
</body>
</html>
